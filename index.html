<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maledict</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #2b0b42, #4a154b, #7b1fa2, #311b92);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
            font-family: sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Экран блокировки для мобильных ===== */
        .mobile-block {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(-45deg, #2b0b42, #4a154b, #7b1fa2, #311b92);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        .mobile-block.show {
            display: flex;
        }

        .mobile-block.show ~ * {
            display: none !important;
        }

        .mb-card {
            background: rgba(35, 10, 60, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 340px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: mbPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes mbPop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .mb-icon {
            font-size: 54px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(180, 130, 255, 0.6));
        }

        .mb-title {
            color: #fff;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 14px;
            text-shadow: 0 0 15px rgba(180, 130, 255, 0.6);
        }

        .mb-text {
            color: rgba(255, 255, 255, 0.75);
            font-size: 15px;
            line-height: 1.5;
        }

        /* Кнопка с информацией «i» в углу */
        .info-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 45px;
            height: 45px;
            font-size: 20px;
            font-weight: bold;
            font-style: italic;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .info-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        /* Модальное окно с информацией */
        .info-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 200;
        }

        .info-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .info-card {
            background: rgba(35, 10, 60, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 320px;
            text-align: center;
            color: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .info-modal.active .info-card {
            transform: scale(1);
        }

        .info-card h3 {
            margin-top: 0;
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
        }

        .info-card p {
            margin: 10px 0;
            font-size: 16px;
            opacity: 0.9;
        }

        .info-close-btn {
            margin-top: 20px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .info-close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Стиль для объемной глянцевой надписи MALEDICT */
        .site-title {
            position: absolute;
            top: 15vh;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.4),
                0 0 15px rgba(180, 130, 255, 0.6),
                0 0 30px rgba(120, 50, 200, 0.4);
            user-select: none;
            pointer-events: none;
        }

        /* Кнопка открытия */
        .open-btn {
            width: 60px;
            height: 60px;
            font-size: 24px;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .open-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        /* Большой квадрат */
        .modal-card {
            position: fixed;
            width: 85vw;
            height: 85vh;
            max-height: 800px;
            background: rgba(35, 10, 60, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.3);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            color: #fff;
            overflow: hidden;
        }

        .modal-card.active {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .modal-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
            flex-shrink: 0;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Контейнер дней с правильным скроллом */
        .days-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
            overflow-y: auto;
            padding-right: 5px;
            flex-grow: 1;
        }

        .days-container::-webkit-scrollbar {
            width: 6px;
        }
        .days-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .day-wrapper {
            display: flex;
            flex-direction: column;
        }

        /* Полоска дня недели */
        .day-bar {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .day-bar:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Выпадающий блок */
        .sub-bar {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .day-wrapper.active .sub-bar {
            max-height: 600px;
            opacity: 1;
            margin-top: 8px;
            padding: 5px;
        }

        /* Островок в рамке линии */
        .entry-island {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Стили полей внутри островка */
        .time-box {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-shrink: 0;
        }

        .time-input, .text-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 8px 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .time-input:focus, .text-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .time-input {
            width: 75px;
        }

        .ampm-select {
            background: rgba(35, 10, 60, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 8px 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .name-input {
            flex: 1;
            min-width: 0;
        }

        .desc-input {
            flex: 1.5;
            min-width: 0;
        }

        /* Кнопки управления */
        .island-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .delete-btn {
            background: rgba(255, 80, 80, 0.2);
            border-color: rgba(255, 80, 80, 0.3);
            color: #ffb3b3;
        }

        .delete-btn:hover {
            background: rgba(255, 80, 80, 0.4);
        }

        .limit-text {
            font-size: 13px;
            opacity: 0.5;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Экран блокировки для телефонов -->
    <div class="mobile-block" id="mobileBlock">
        <div class="mb-card">
            <div class="mb-icon">🖥️</div>
            <div class="mb-title">Только для ПК</div>
            <div class="mb-text">Maledict не поддерживает мобильные устройства.<br>Пожалуйста, откройте сайт с компьютера.</div>
        </div>
    </div>

    <!-- Кнопка «i» в углу экрана -->
    <button class="info-btn" onclick="toggleInfoModal()">i</button>

    <!-- Модальное окно с информацией об авторах -->
    <div class="info-modal" id="infoModal" onclick="toggleInfoModal()">
        <div class="info-card" onclick="event.stopPropagation()">
            <h3>Авторы и соавторы</h3>
            <p><b>Автор:</b> kef1r</p>
            <p><b>Главный соавтор:</b> Zef1r</p>
            <button class="info-close-btn" onclick="toggleInfoModal()">Закрыть</button>
        </div>
    </div>

    <!-- Глянцевая надпись сверху -->
    <div class="site-title">maledict</div>

    <button class="open-btn" onclick="toggleModal()">+</button>

    <div class="modal-card" id="myModal">
        <div class="modal-header">
            <button class="close-btn" onclick="toggleModal()">✕</button>
        </div>

        <div class="days-container" id="daysContainer"></div>
    </div>

    <script>
        // ===== Проверка на мобильное устройство =====
        function isMobileDevice() {
            const uaCheck = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent);
            const widthCheck = window.innerWidth <= 900;
            const touchCheck = ('ontouchstart' in window || navigator.maxTouchPoints > 0);
            return uaCheck || (widthCheck && touchCheck);
        }

        function checkMobile() {
            const blockEl = document.getElementById('mobileBlock');
            if (isMobileDevice()) {
                blockEl.classList.add('show');
            } else {
                blockEl.classList.remove('show');
            }
        }

        checkMobile();
        window.addEventListener('resize', checkMobile);

        const daysData = [
            { id: 'mon', name: 'ПОНЕДЕЛЬНИК', short: 'ПН' },
            { id: 'tue', name: 'ВТОРНИК', short: 'ВТ' },
            { id: 'wed', name: 'СРЕДА', short: 'СР' },
            { id: 'thu', name: 'ЧЕТВЕРГ', short: 'ЧТ' },
            { id: 'fri', name: 'ПЯТНИЦА', short: 'ПТ' },
            { id: 'sat', name: 'СУББОТА', short: 'СБ' },
            { id: 'sun', name: 'ВОСКРЕСЕНЬЕ', short: 'ВС' }
        ];

        function loadData() {
            return JSON.parse(localStorage.getItem('weekSchedule')) || {};
        }

        function saveData(data) {
            localStorage.setItem('weekSchedule', JSON.stringify(data));
        }

        function getCurrentTimeAndAmPm() {
            const now = new Date();
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return { time: `${hours}:${minutes}`, ampm: ampm };
        }

        function renderDays() {
            const container = document.getElementById('daysContainer');
            const data = loadData();
            container.innerHTML = '';

            daysData.forEach(day => {
                const dayEntries = data[day.id] || [];
                const isMaxReached = dayEntries.length >= 3;

                const wrapper = document.createElement('div');
                wrapper.className = 'day-wrapper';
                wrapper.dataset.dayId = day.id;

                wrapper.innerHTML = `
                    <div class="day-bar" onclick="toggleDay(this)">
                        ${day.name} <span style="opacity: 0.6;">${day.short}</span>
                    </div>
                    <div class="sub-bar">
                        <div class="entries-list" data-day="${day.id}"></div>
                        <div class="island-actions">
                            ${!isMaxReached ? `<button class="action-btn" onclick="addEntry('${day.id}')">+ Добавить</button>` : '<span class="limit-text">Максимум 3 записи</span>'}
                        </div>
                    </div>
                `;

                container.appendChild(wrapper);

                const listContainer = wrapper.querySelector('.entries-list');
                dayEntries.forEach((entry, index) => {
                    const island = document.createElement('div');
                    island.className = 'entry-island';
                    island.innerHTML = `
                        <div class="time-box">
                            <input type="text" class="text-input time-input" value="${entry.time || ''}" placeholder="12:00" oninput="handleTimeInput(this, '${day.id}', ${index})">
                            <select class="ampm-select" onchange="updateEntry('${day.id}', ${index}, 'ampm', this.value)">
                                <option value="AM" ${entry.ampm === 'AM' ? 'selected' : ''}>AM</option>
                                <option value="PM" ${entry.ampm === 'PM' ? 'selected' : ''}>PM</option>
                            </select>
                        </div>
                        <input type="text" class="text-input name-input" value="${entry.name || ''}" placeholder="Имя..." oninput="updateEntry('${day.id}', ${index}, 'name', this.value)">
                        <input type="text" class="text-input desc-input" value="${entry.desc || ''}" placeholder="Описание..." oninput="updateEntry('${day.id}', ${index}, 'desc', this.value)">
                        <button class="action-btn delete-btn" onclick="deleteEntry('${day.id}', ${index})">✕</button>
                    `;
                    listContainer.appendChild(island);
                });
            });
        }

        function toggleModal() {
            const modal = document.getElementById('myModal');
            modal.classList.toggle('active');
        }

        // Управление информационным окном
        function toggleInfoModal() {
            const infoModal = document.getElementById('infoModal');
            infoModal.classList.toggle('active');
        }

        function toggleDay(element) {
            const wrapper = element.parentElement;
            wrapper.classList.toggle('active');
        }

        function addEntry(dayId) {
            const data = loadData();
            if (!data[dayId]) data[dayId] = [];

            if (data[dayId].length < 3) {
                const autoTime = getCurrentTimeAndAmPm();
                data[dayId].push({ time: autoTime.time, ampm: autoTime.ampm, name: '', desc: '' });
                saveData(data);
                renderDays();
                document.querySelector(`[data-day-id="${dayId}"]`).classList.add('active');
            }
        }

        function handleTimeInput(input, dayId, index) {
            let filtered = input.value.replace(/[^0-9:]/g, '');
            input.value = filtered;
            updateEntry(dayId, index, 'time', filtered);
        }

        function updateEntry(dayId, index, field, value) {
            const data = loadData();
            if (data[dayId] && data[dayId][index]) {
                data[dayId][index][field] = value;
                saveData(data);
            }
        }

        function deleteEntry(dayId, index) {
            const data = loadData();
            if (data[dayId]) {
                data[dayId].splice(index, 1);
                saveData(data);
                renderDays();
                document.querySelector(`[data-day-id="${dayId}"]`).classList.add('active');
            }
        }

        renderDays();
    </script>

</body>
</html>
