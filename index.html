<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maledict</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #2b0b42, #4a154b, #7b1fa2, #311b92);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
            font-family: sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Кнопка с информацией «i» в углу */
        .info-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 45px;
            height: 45px;
            font-size: 20px;
            font-weight: bold;
            font-style: italic;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .info-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        /* Модальное окно с информацией */
        .info-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 200;
        }

        .info-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .info-card {
            background: rgba(35, 10, 60, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 320px;
            max-width: 85vw;
            text-align: center;
            color: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .info-modal.active .info-card {
            transform: scale(1);
        }

        .info-card h3 {
            margin-top: 0;
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
        }

        /* Стили для строк авторов с аватарками */
        .author-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
            font-size: 16px;
        }

        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0.9;
        }

        .info-close-btn {
            margin-top: 20px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .info-close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Стиль для объемной глянцевой надписи MALEDICT */
        .site-title {
            position: absolute;
            top: 15vh;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.4),
                0 0 15px rgba(180, 130, 255, 0.6),
                0 0 30px rgba(120, 50, 200, 0.4);
            user-select: none;
            pointer-events: none;
        }

        /* Главная кнопка '+' */
        .open-btn {
            width: 60px;
            height: 60px;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .open-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        /* ===== Пузырёк выбора (блокнот / календарь) ===== */
        .choice-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 200;
        }

        .choice-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .choice-card {
            position: relative;
            background: rgba(35, 10, 60, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 35px 30px 30px;
            width: 300px;
            max-width: 85vw;
            text-align: center;
            color: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .choice-modal.active .choice-card {
            transform: scale(1);
        }

        .choice-close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            border-radius: 50%;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .choice-close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .choice-title {
            font-size: 18px;
            letter-spacing: 1px;
            margin: 0 0 6px;
            opacity: 0.9;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .choice-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .choice-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.85;
        }

        /* Большой квадрат (календарь) */
        .modal-card {
            position: fixed;
            width: 85vw;
            height: 85vh;
            max-height: 800px;
            background: rgba(35, 10, 60, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.3);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            color: #fff;
            overflow: hidden;
        }

        .modal-card.active {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .modal-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
            flex-shrink: 0;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== Блокнот ===== */
        .notepad-modal {
            position: fixed;
            width: 85vw;
            height: 85vh;
            max-height: 800px;
            background: rgba(35, 10, 60, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.3);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            color: #fff;
            overflow: hidden;
        }

        .notepad-modal.active {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Панель ввода нового текста */
        .notepad-input-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 15px;
            border-radius: 18px;
        }

        .notepad-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .notepad-field {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #fff;
            padding: 12px 18px;
            font-size: 18px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .notepad-field:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .notepad-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .notepad-add-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 0 24px;
            height: 50px;
            border-radius: 14px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .notepad-add-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Лента записей */
        .notepad-lines-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        .notepad-lines-container::-webkit-scrollbar {
            width: 6px;
        }
        .notepad-lines-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Фиолетовый пузырь */
        .notepad-line {
            background: rgba(65, 20, 105, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 20px 24px;
            border-radius: 20px;
            font-size: 18px;
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .notepad-content-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            word-break: break-word;
            white-space: pre-wrap;
            max-height: 5.6em;
            overflow-y: auto;
        }

        .notepad-content-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .notepad-content-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .notepad-line-delete {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
            padding: 0;
            flex-shrink: 0;
        }

        .notepad-line-delete:hover {
            color: #ffb3b3;
        }

        /* Контейнер дней */
        .days-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
            overflow-y: auto;
            padding-right: 5px;
            flex-grow: 1;
        }

        .days-container::-webkit-scrollbar {
            width: 6px;
        }
        .days-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .day-wrapper {
            display: flex;
            flex-direction: column;
        }

        .day-bar {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .day-bar:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .sub-bar {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .day-wrapper.active .sub-bar {
            max-height: 600px;
            opacity: 1;
            margin-top: 8px;
            padding: 5px;
        }

        .entry-island {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .time-box {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-shrink: 0;
        }

        .time-input, .text-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 8px 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .time-input:focus, .text-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .time-input {
            width: 75px;
        }

        .ampm-select {
            background: rgba(35, 10, 60, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 8px 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .name-input {
            flex: 1;
            min-width: 0;
        }

        .desc-input {
            flex: 1.5;
            min-width: 0;
        }

        .island-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .delete-btn {
            background: rgba(255, 80, 80, 0.2);
            border-color: rgba(255, 80, 80, 0.3);
            color: #ffb3b3;
        }

        .delete-btn:hover {
            background: rgba(255, 80, 80, 0.4);
        }

        .limit-text {
            font-size: 13px;
            opacity: 0.5;
            font-style: italic;
        }

        /* ===== Адаптация под мобильные экраны ===== */
        @media (max-width: 700px) {
            .site-title {
                font-size: 28px;
                top: 8vh;
                letter-spacing: 2px;
                text-align: center;
                padding: 0 10px;
            }

            .info-btn {
                top: 15px;
                right: 15px;
                width: 38px;
                height: 38px;
                font-size: 16px;
            }

            .open-btn {
                width: 50px;
                height: 50px;
            }

            .modal-card,
            .notepad-modal {
                width: 94vw;
                height: 92vh;
                max-height: none;
                padding: 16px;
                border-radius: 20px;
            }

            .notepad-row {
                flex-wrap: wrap;
            }

            .notepad-field {
                flex: 1 1 100%;
            }

            .notepad-add-btn {
                flex: 1;
                width: 100%;
            }

            .day-bar {
                padding: 12px 16px;
                font-size: 15px;
            }

            .entry-island {
                flex-wrap: wrap;
                gap: 8px;
                padding: 10px 12px;
            }

            .time-box {
                width: 100%;
                justify-content: space-between;
            }

            .time-input {
                flex: 1;
                min-width: 0;
                width: auto;
            }

            .ampm-select {
                flex-shrink: 0;
            }

            .name-input,
            .desc-input {
                flex: 1 1 100%;
                width: 100%;
            }

            .island-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <!-- Кнопка «i» в углу экрана -->
    <button class="info-btn" onclick="toggleInfoModal()">i</button>

    <!-- Модальное окно с информацией об авторах -->
    <div class="info-modal" id="infoModal" onclick="toggleInfoModal()">
        <div class="info-card" onclick="event.stopPropagation()">
            <h3>Авторы и соавторы</h3>

            <!-- Кефир -->
            <div class="author-row">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdHP83sREzxiJ7Vzz0QnbsvBzo1lfiVI8j5w9rF00fsA&s=10" alt="kef1r" class="author-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222%22><path d=%22M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2%22/><circle cx=%2212%22 cy=%227%22 r=%224%22/></svg>'">
                <span><b>Автор:</b> kef1r</span>
            </div>

            <!-- Зефир -->
            <div class="author-row">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSenDWmnyQrDVwAoN79avV6TX0BnWOcZif4kiqVomjd0bzGiuYgq6B4nkjG&s=10" alt="Zef1r" class="author-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222%22><path d=%22M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2%22/><circle cx=%2212%22 cy=%227%22 r=%224%22/></svg>'">
                <span><b>Главный соавтор:</b> Zef1r</span>
            </div>

            <button class="info-close-btn" onclick="toggleInfoModal()">Закрыть</button>
        </div>
    </div>

    <!-- Глянцевая надпись сверху -->
    <div class="site-title">maledict</div>

    <!-- Главная кнопка '+' -->
    <button class="open-btn" onclick="toggleChoiceModal()">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <!-- Пузырёк выбора: блокнот или календарь -->
    <div class="choice-modal" id="choiceModal" onclick="toggleChoiceModal()">
        <div class="choice-card" onclick="event.stopPropagation()">
            <button class="choice-close-btn" onclick="toggleChoiceModal()">✕</button>
            <p class="choice-title">Что открыть?</p>

            <div class="choice-btn" onclick="chooseNotepad()">
                <svg viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                Блокнот
            </div>

            <div class="choice-btn" onclick="chooseCalendar()">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                Календарь
            </div>
        </div>
    </div>

    <div class="modal-card" id="myModal">
        <div class="modal-header">
            <button class="close-btn" onclick="toggleModal()">✕</button>
        </div>

        <div class="days-container" id="daysContainer"></div>
    </div>

    <!-- Блокнот -->
    <div class="notepad-modal" id="notepadModal">
        <div class="modal-header">
            <button class="close-btn" onclick="toggleNotepadModal()">✕</button>
        </div>

        <div class="notepad-input-box">
            <div class="notepad-row">
                <input type="text" class="notepad-field" id="notepadInput" placeholder="Пиши сюда и нажми Enter..." onkeydown="handleNotepadKey(event)">
                <button class="notepad-add-btn" onclick="addNotepadLine()">Добавить</button>
            </div>
        </div>

        <div class="notepad-lines-container" id="notepadLinesContainer"></div>
    </div>

    <script>
        const daysData = [
            { id: 'mon', name: 'ПОНЕДЕЛЬНИК', short: 'ПН' },
            { id: 'tue', name: 'ВТОРНИК', short: 'ВТ' },
            { id: 'wed', name: 'СРЕДА', short: 'СР' },
            { id: 'thu', name: 'ЧЕТВЕРГ', short: 'ЧТ' },
            { id: 'fri', name: 'ПЯТНИЦА', short: 'ПТ' },
            { id: 'sat', name: 'СУББОТА', short: 'СБ' },
            { id: 'sun', name: 'ВОСКРЕСЕНЬЕ', short: 'ВС' }
        ];

        function loadData() {
            return JSON.parse(localStorage.getItem('weekSchedule')) || {};
        }

        function saveData(data) {
            localStorage.setItem('weekSchedule', JSON.stringify(data));
        }

        function getCurrentTimeAndAmPm() {
            const now = new Date();
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return { time: `${hours}:${minutes}`, ampm: ampm };
        }

        function renderDays() {
            const container = document.getElementById('daysContainer');
            const data = loadData();
            container.innerHTML = '';

            daysData.forEach(day => {
                const dayEntries = data[day.id] || [];
                const isMaxReached = dayEntries.length >= 3;

                const wrapper = document.createElement('div');
                wrapper.className = 'day-wrapper';
                wrapper.dataset.dayId = day.id;

                wrapper.innerHTML = `
                    <div class="day-bar" onclick="toggleDay(this)">
                        ${day.name} <span style="opacity: 0.6;">${day.short}</span>
                    </div>
                    <div class="sub-bar">
                        <div class="entries-list" data-day="${day.id}"></div>
                        <div class="island-actions">
                            ${!isMaxReached ? `<button class="action-btn" onclick="addEntry('${day.id}')">+ Добавить</button>` : '<span class="limit-text">Максимум 3 записи</span>'}
                        </div>
                    </div>
                `;

                container.appendChild(wrapper);

                const listContainer = wrapper.querySelector('.entries-list');
                dayEntries.forEach((entry, index) => {
                    const island = document.createElement('div');
                    island.className = 'entry-island';
                    island.innerHTML = `
                        <div class="time-box">
                            <input type="text" class="text-input time-input" value="${entry.time || ''}" placeholder="12:00" oninput="handleTimeInput(this, '${day.id}', ${index})">
                            <select class="ampm-select" onchange="updateEntry('${day.id}', ${index}, 'ampm', this.value)">
                                <option value="AM" ${entry.ampm === 'AM' ? 'selected' : ''}>AM</option>
                                <option value="PM" ${entry.ampm === 'PM' ? 'selected' : ''}>PM</option>
                            </select>
                        </div>
                        <input type="text" class="text-input name-input" value="${entry.name || ''}" placeholder="Имя..." oninput="updateEntry('${day.id}', ${index}, 'name', this.value)">
                        <input type="text" class="text-input desc-input" value="${entry.desc || ''}" placeholder="Описание..." oninput="updateEntry('${day.id}', ${index}, 'desc', this.value)">
                        <button class="action-btn delete-btn" onclick="deleteEntry('${day.id}', ${index})">✕</button>
                    `;
                    listContainer.appendChild(island);
                });
            });
        }

        function toggleModal() {
            const modal = document.getElementById('myModal');
            modal.classList.toggle('active');
        }

        function toggleInfoModal() {
            const infoModal = document.getElementById('infoModal');
            infoModal.classList.toggle('active');
        }

        function toggleChoiceModal() {
            const choiceModal = document.getElementById('choiceModal');
            choiceModal.classList.toggle('active');
        }

        function chooseCalendar() {
            toggleChoiceModal();
            toggleModal();
        }

        function chooseNotepad() {
            toggleChoiceModal();
            toggleNotepadModal();
        }

        function toggleNotepadModal() {
            const notepadModal = document.getElementById('notepadModal');
            const wasActive = notepadModal.classList.contains('active');
            notepadModal.classList.toggle('active');

            if (!wasActive) {
                renderNotepadLines();
            }
        }

        function loadNotepadLines() {
            return JSON.parse(localStorage.getItem('notepadLines')) || [];
        }

        function saveNotepadLines(lines) {
            localStorage.setItem('notepadLines', JSON.stringify(lines));
        }

        function renderNotepadLines() {
            const container = document.getElementById('notepadLinesContainer');
            const lines = loadNotepadLines();
            container.innerHTML = '';

            lines.forEach((text, index) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'notepad-line';

                lineDiv.innerHTML = `
                    <div class="notepad-content-wrapper">
                        <span>${text}</span>
                    </div>
                    <button class="notepad-line-delete" onclick="deleteNotepadLine(${index})">✕</button>
                `;
                container.appendChild(lineDiv);
            });
        }

        function handleNotepadKey(event) {
            if (event.key === 'Enter') {
                addNotepadLine();
            }
        }

        function addNotepadLine() {
            const input = document.getElementById('notepadInput');
            const text = input.value.trim();

            if (!text) return;

            let lines = loadNotepadLines();
            lines.unshift(text);

            saveNotepadLines(lines);
            input.value = '';
            renderNotepadLines();
        }

        function deleteNotepadLine(index) {
            let lines = loadNotepadLines();
            lines.splice(index, 1);
            saveNotepadLines(lines);
            renderNotepadLines();
        }

        function toggleDay(element) {
            const wrapper = element.parentElement;
            wrapper.classList.toggle('active');
        }

        function addEntry(dayId) {
            const data = loadData();
            if (!data[dayId]) data[dayId] = [];

            if (data[dayId].length < 3) {
                const autoTime = getCurrentTimeAndAmPm();
                data[dayId].push({ time: autoTime.time, ampm: autoTime.ampm, name: '', desc: '' });
                saveData(data);
                renderDays();
                document.querySelector(`[data-day-id="${dayId}"]`).classList.add('active');
            }
        }

        function handleTimeInput(input, dayId, index) {
            let filtered = input.value.replace(/[^0-9:]/g, '');
            input.value = filtered;
            updateEntry(dayId, index, 'time', filtered);
        }

        function updateEntry(dayId, index, field, value) {
            const data = loadData();
            if (data[dayId] && data[dayId][index]) {
                data[dayId][index][field] = value;
                saveData(data);
            }
        }

        function deleteEntry(dayId, index) {
            const dataData = loadData();
            if (dataData[dayId]) {
                dataData[dayId].splice(index, 1);
                saveData(dataData);
                renderDays();
                document.querySelector(`[data-day-id="${dayId}"]`).classList.add('active');
            }
        }

        renderDays();
    </script>

</body>
</html>
